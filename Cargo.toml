[package]
name = "gpui_remote"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.6"
reqwest_client = { package = "gpui-pre-reqwest-client", version = "0.3.1" }
alacritty_terminal = "0.26.0"


log = {version = "0.4.29"}
chrono = {version = "0.4.43", features = ["default"]}
fern = "0.7.1"
tracing-appender = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.100"
axum = "0.8.8"
tokio = {version = "1.49.0", features = ["full"]}
serde_json = "1.0.149"
rust-embed = "8.11.0"
uuid = { version = "1.22.0", features = ["v4"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
russh = "0.63.3"
russh-sftp = "3.0.0"
rmcp = { version = "3.0.0", features = ["transport-streamable-http-server"] }
tokio-socks = "0.5.2"
unicode-width = "0.2.2"
notify = "8.2.0"
filetime = "0.2.25"

[build-dependencies]
chrono = { version = "0.4.43", features = ["default"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
